name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version as major.minor.patch. It must already be in package.json and manifest.json on main.'
        required: true
        type: string
      notes:
        description: "What's new in this release"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Install from the lockfile: plain install can lose Rollup's platform binary.
      - run: npm ci --no-audit --no-fund

      # main accepts changes only through pull requests, so the version is set in a pull request
      # before the release. This step only checks it.
      - name: Check the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be major.minor.patch, got '$VERSION'" >&2
            exit 1
          fi
          for file in package.json manifest.json; do
            actual=$(node -p "require('./$file').version")
            if [ "$actual" != "$VERSION" ]; then
              echo "$file has version $actual, not $VERSION. Change it in a pull request first." >&2
              exit 1
            fi
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run pack
          mv app.zip "app-$VERSION.zip"
          unzip -Z1 "app-$VERSION.zip" | grep -Fxq 'manifest.json'

      - name: Tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "release-$VERSION"
          git push origin "release-$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            gh release create "release-$VERSION" "app-$VERSION.zip" --title "$VERSION" --notes "$NOTES"
          else
            gh release create "release-$VERSION" "app-$VERSION.zip" --title "$VERSION" --generate-notes
          fi
